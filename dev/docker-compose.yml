# Local databases for testing the plugin
#
#   docker compose -f dev/docker-compose.yml up -d
#   docker compose -f dev/docker-compose.yml down                # stop (data is kept)
#   docker compose -f dev/docker-compose.yml down -v             # stop and wipe the data
#
services:
  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: fourelements
      MYSQL_DATABASE: fourelements
      MYSQL_USER: fourelements
      MYSQL_PASSWORD: fourelements
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
