name: FourElements
version: '${version}'
main: com.github.manu585.fourelements.bukkit.FourElementsPlugin
loader: com.github.manu585.fourelements.bukkit.loader.FourElementsPluginLoader
description: Minecraft bending plugin inspired by Avatar the last Airbender.
api-version: '26.3'
author: Manunu_
website: https://gogg-tech.com

dependencies:
  server:
    packetevents:
      load: BEFORE
      required: true
      join-classpath: true

permissions:
  fourelements.*:
    description: FourElements OP
    default: op
    children:
      fourelements.command.*: true
      fourelements.element.*: true

  fourelements.command.*:
    description: all /elements subcommands
    default: op
    children:
      fourelements.command.set: true
      fourelements.command.sub: true

  fourelements.command.set:
    description: set the main element of yourself or another player
    default: op
  fourelements.command.sub:
    description: add or remove sub-elements of yourself or another player
    default: op

  fourelements.element.*:
    description: access to all elements
    default: false
    children:
      fourelements.element.air: true
      fourelements.element.water: true
      fourelements.element.earth: true
      fourelements.element.fire: true