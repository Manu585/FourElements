name: Release

# Run manually (Actions tab -> Release -> Run workflow). The release is tagged
# `v<version>` using the version in gradle.properties, so that is the only
# place to bump.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "value=$(sed -n 's/^version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build -x deployPlugin --stacktrace

      # Fails if the tag already exists, i.e. the version was not bumped.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$VERSION" bukkit/build/libs/*-all.jar \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --prerelease
