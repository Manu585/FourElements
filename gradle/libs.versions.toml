[versions]
java         = "25"
paper        = "26.2.build.124-stable"
packetevents = "2.13.0"
hikari       = "7.1.0"
mysql        = "26.7.0"
lombok       = "1.18.48"
junit        = "5.14.4"
checkstyle   = "14.1.0"
shadow       = "9.4.2"

[libraries]
paper-api    = { module = "io.papermc.paper:paper-api",               version.ref = "paper" }
packetevents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
hikari       = { module = "com.zaxxer:HikariCP",                      version.ref = "hikari" }
mysql        = { module = "com.mysql:mysql-connector-j",              version.ref = "mysql" }
lombok       = { module = "org.projectlombok:lombok",                 version.ref = "lombok" }

# Versions come from junit-bom, so these are declared without one.
junit-bom               = { module = "org.junit:junit-bom",                    version.ref = "junit" }
junit-jupiter           = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
